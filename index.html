  <style>

00 34px Georgia,"Songti SC",serif;margin:6px 0 24px}.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.style{border:0;border-radius:22px;padding:24px;text-align:left;min-height:135px;cursor:pointer}.style b{display:block;margin-top:35px;font:600 25px Georgia}.style span{font-size:11px;opacity:.6}.style:nth-child(1){background:#ffd9cb}.style:nth-child(2){background:#dcd2ff}.style:nth-child(3){background:#cde7dc}.filters{display:flex;gap:8px;margin-bottom:24px;overflow:auto}.filter{border:1px solid var(--line);background:white;border-radius:99px;padding:8px 14px;white-space:nowrap;cursor:pointer}.filter.active{background:var(--ink);border-color:var(--ink);color:white}.teachers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.teacher{border:1px solid var(--line);border-radius:23px;overflow:hidden;background:#fff;box-shadow:0 12px 30px #392d2410}.photo{height:195px;display:grid;place-items:center;position:relative}.photo:after{content:"";position:absolute;inset:14px;border:1px solid #ffffff70;border-radius:17px}.photo span{font:italic 600 54px Georgia;color:#ffffffd9;letter-spacing:-.08em}.sunset{background:linear-gradient(135deg,#ff836b,#f3b088 55%,#7861c8)}.ocean{background:linear-gradient(135deg,#385d7a,#78b8bc 58%,#e6b597)}.berry{background:linear-gradient(135deg,#693767,#c55b79 55%,#f0b08e)}.info{padding:18px}.name{display:flex;justify-content:space-between}.name h3{font:600 24px Georgia;margin:0}.rating{color:#ee9c12;font-weight:700}.verified{display:inline-block;margin-top:5px;background:#e4f4ec;color:#257655;border-radius:99px;padding:3px 7px;font-size:10px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.tags span{background:var(--cream);border-radius:99px;padding:5px 8px;font-size:11px;font-weight:700}.intro{font-size:13px;line-height:1.65;color:var(--muted);min-height:64px}.meta{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:8px;font-size:10px;color:var(--muted)}.price{margin-left:auto;color:var(--ink);font-size:14px;font-weight:800}.booking-date{margin-top:15px}.booking-date>span{display:block;font-size:11px;font-weight:800;margin-bottom:8px}.date-options{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}.date-chip{min-width:58px;border:1px solid var(--line);background:white;border-radius:12px;padding:7px 5px;color:var(--muted);font-size:10px;line-height:1.35;cursor:pointer}.date-chip b{display:block;color:var(--ink);font-size:12px}.date-chip.active{background:#ece8ff;border-color:var(--violet);color:var(--violet)}.date-chip.active b{color:var(--violet)}.custom-date{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:var(--muted)}.custom-date input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:7px;color:var(--ink);font:inherit;background:white}.book{width:100%;margin-top:12px;border:1px solid var(--ink);background:var(--ink);color:white;border-radius:99px;padding:11px;font-weight:700;cursor:pointer}.book:hover{background:var(--violet);border-color:var(--violet)}.helper{margin:0 5% 50px;border-radius:26px;background:var(--violet);color:white;padding:35px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}.helper h2{font:600 29px Georgia,"Songti SC",serif;margin:4px 0}.helper p{margin:0;opacity:.75}.helper .cta{background:white;color:var(--violet);white-space:nowrap}.notice{font-size:12px;color:var(--muted);text-align:center;padding:0 18px}.toast{display:none;position:fixed;left:50%;top:82px;transform:translateX(-50%);z-index:20;background:var(--ink);color:white;padding:11px 17px;border-radius:99px;box-shadow:0 10px 25px #0003}.toast.show{display:block}.nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));display:flex;justify-content:space-around;background:#201e29f2;color:#ffffff80;padding:11px;border-radius:23px;box-shadow:0 15px 40px #0003}.nav a{color:inherit;text-decoration:none;font-size:11px;text-align:center}.nav b{display:block;color:white;font-size:18px;margin-bottom:2px}
    @media(max-width:720px){html,body{background:#fffdf9}.app{box-shadow:none}.top{height:62px;padding:0 18px}.brand small{display:none}.hero{padding:55px 23px;min-height:425px}.hero h1{font-size:43px}.hero:after{right:-200px}.section{padding:42px 18px}.styles{grid-template-columns:1fr}.style{min-height:105px}.style b{margin-top:20px}.teachers{grid-template-columns:1fr}.teacher{display:grid;grid-template-columns:120px 1fr}.photo{height:100%;min-height:230px}.photo span{font-size:39px}.intro{min-height:auto}.meta{flex-wrap:wrap}.price{width:100%;margin:0}.helper{margin:0 18px 40px;padding:27px;display:block}.helper p{margin-bottom:22px}}

<body>
<div class="app">
  <header class="top"><div class="brand"><span class="mark">i</span><span><b>iSalsa</b><small>LATIN DANCE · SHANGHAI</small></span></div><span class="city">上海⌄</span></header>
  <section class="hero"><span class="eyebrow">FIND YOUR RHYTHM</span><h1>遇见适合你的<br><em>拉丁舞老师</em></h1><p>精选 Salsa、Bachata、Kizomba 老师，私课与舞会舞伴都可以咨询预约。</p><a class="cta" href="#teachers">开始选择老师　→</a></section>
  <section class="section"><small>CHOOSE A STYLE</small><h2>你想跳什么？</h2><div class="styles"><button class="style" data-filter="Salsa"><span>01 · 热情与节奏</span><b>Salsa</b></button><button class="style" data-filter="Bachata"><span>02 · 浪漫与连接</span><b>Bachata</b></button><button class="style" data-filter="Kizomba"><span>03 · 细腻与流动</span><b>Kizomba</b></button></div></section>
  <section class="section" id="teachers"><small>FEATURED TEACHERS</small><h2>推荐老师</h2><div class="filters"><button class="filter active" data-filter="全部">全部</button><button class="filter" data-filter="Salsa">Salsa</button><button class="filter" data-filter="Bachata">Bachata</button><button class="filter" data-filter="Kizomba">Kizomba</button></div><div class="teachers" id="teacherList"></div></section>
  <section class="helper"><div><small>需要帮你推荐？</small><h2>短信联系 iSalsa 顾问</h2><p>告诉我们你的舞种、时间和预算，我们帮你联系合适的老师。</p></div><a class="cta sms-general" href="#">打开短信咨询</a></section>
  <p class="notice">免费体验版暂不提供在线支付。选择老师与日期后，点击按钮即可生成预约短信。</p>
</div>
<div class="toast" id="toast">请先选择预约日期</div>
<nav class="nav"><a href="#"><b>⌂</b>首页</a><a href="#teachers"><b>◉</b>找老师</a><a class="sms-general" href="#"><b>＋</b>短信咨询</a></nav>
<script>
const teachers=[
 {name:'Mia',initials:'MI',photo:'sunset',dances:['Salsa','Bachata'],rating:'4.9',reviews:38,rate:98,price:480,intro:'专注零基础启蒙、身体律动与双人连接，让第一次跳舞也能轻松享受音乐。'},
 {name:'Leo',initials:'LE',photo:'ocean',dances:['Salsa','Kizomba'],rating:'4.8',reviews:26,rate:100,price:500,intro:'强调节奏、引带与跟随技巧，适合希望快速提升社交舞实战能力的学员。'},
 {name:'Sofia',initials:'SO',photo:'berry',dances:['Bachata','Kizomba'],rating:'4.9',reviews:42,rate:97,price:320,intro:'擅长女士风格、音乐表达和细节打磨，课堂轻松耐心，支持中英文教学。'}
];
const list=document.getElementById('teacherList');
const selectedDates={};
const dateValue=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const quickDates=()=>Array.from({length:3},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return{value:dateValue(d),label:['今天','明天','后天'][i],day:`${d.getMonth()+1}/${d.getDate()}`}});
function datePicker(t){return `<div class="booking-date"><span>选择预约日期</span><div class="date-options">${quickDates().map(d=>`<button class="date-chip ${selectedDates[t.name]===d.value?'active':''}" onclick="selectDate('${t.name}','${d.value}',this)"><b>${d.label}</b>${d.day}</button>`).join('')}</div><label class="custom-date">其他日期<input type="date" min="${dateValue(new Date())}" value="${selectedDates[t.name]||''}" onchange="selectCustomDate('${t.name}',this)"></label></div>`}
function render(filter='全部'){list.innerHTML=teachers.filter(t=>filter==='全部'||t.dances.includes(filter)).map(t=>`<article class="teacher"><div class="photo ${t.photo}"><span>${t.initials}</span></div><div class="info"><div class="name"><div><h3>${t.name}</h3><span class="verified">已审核</span></div><span class="rating">★ ${t.rating}</span></div><div class="tags">${t.dances.map(d=>`<span>${d}</span>`).join('')}</div><p class="intro">${t.intro}</p><div class="meta"><span>${t.reviews}条评价</span><span>履约率 ${t.rate}%</span><span class="price">¥${t.price} 起</span></div>${datePicker(t)}<button class="book" onclick="bookBySms('${t.name}')">短信咨询并预约</button></div></article>`).join('')}
function selectDate(name,date,button){selectedDates[name]=date;button.closest('.booking-date').querySelectorAll('.date-chip').forEach(b=>b.classList.toggle('active',b===button));button.closest('.booking-date').querySelector('input').value=date}
function selectCustomDate(name,input){selectedDates[name]=input.value;input.closest('.booking-date').querySelectorAll('.date-chip').forEach(b=>b.classList.remove('active'))}
function choose(filter){document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));render(filter);document.getElementById('teachers').scrollIntoView({behavior:'smooth'})}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.filter)));
function openSms(message){const separator=/iPad|iPhone|iPod/.test(navigator.userAgent)?'&':'?';location.href=`sms:15618686803${separator}body=${encodeURIComponent(message)}`}
function bookBySms(name){const date=selectedDates[name];if(!date){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);return}const d=new Date(`${date}T00:00:00`);const formatted=`${d.getMonth()+1}月${d.getDate()}日（${'日一二三四五六'[d.getDay()]}）`;openSms(`您好，我想咨询预约 ${name} 老师，预约日期：${formatted}。请问这个时间是否可以？`)}
document.querySelectorAll('.sms-general').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openSms('您好，我想咨询 iSalsa 拉丁舞老师，请帮我推荐合适的老师和时间。')}));render();
</script>
</body>
</html>
